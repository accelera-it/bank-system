x-tests: &tests
  image: bank-system-tests
  build:
    context: .
    dockerfile: tests/Dockerfile

services:
  web-unit:
    <<: *tests
    command: tests/BankSystem.UnitTests

  web-integration:
    <<: *tests
    command: tests/BankSystem.IntegrationTests

  api-unit:
    <<: *tests
    command: tests/CentralApi.UnitTests

  api-integration:
    <<: *tests
    command: tests/CentralApi.IntegrationTests

  demo-unit:
    <<: *tests
    command: tests/DemoShop.UnitTests

  demo-integration:
    <<: *tests
    command: tests/DemoShop.IntegrationTests
