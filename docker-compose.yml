x-app-healthcheck: &app-healthcheck
  test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5000 && printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3" ]
  interval: 10s
  timeout: 5s
  start_period: 30s
  retries: 5

services:
  db:
    build:
      context: data
    platform: linux/amd64
    env_file: locale.env
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1" ]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
    networks:
      - bank_lan

  api:
    build:
      context: .
      dockerfile: web/CentralApi/Dockerfile
    env_file: locale.env
    ports:
      - "8080:5000"
    healthcheck: *app-healthcheck
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bank_lan

  web:
    build:
      context: .
      dockerfile: web/BankSystem.Web/Dockerfile
    env_file: locale.env
    ports:
      - "8081:5000"
    healthcheck: *app-healthcheck
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - bank_lan

  demo:
    build:
      context: .
      dockerfile: demo/DemoShop.Web/Dockerfile
    env_file: locale.env
    ports:
      - "8082:5000"
    healthcheck: *app-healthcheck
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - bank_lan

volumes:
  mssql-data:

networks:
  bank_lan:
    name: bank_lan
