name: shop-test

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 3s
  retries: 12

services:
  api-tests:
    build:
      context: api
      dockerfile: tests/Dockerfile

  ui-tests:
    build:
      context: app
      dockerfile: tests/Dockerfile
    depends_on:
      ui:
        condition: service_healthy
      central-stub:
        condition: service_healthy

  central-stub:
    build:
      context: app
      dockerfile: tests/Dockerfile
    entrypoint: [ "node", "tests/central-stub.ts" ]
    healthcheck:
      <<: *healthcheck
      test: [ "CMD", "node", "-e", "require('net').connect(5000, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))" ]

  pg:
    build:
      context: data/pg
    env_file: shop.env
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      <<: *healthcheck
      test: [ "CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"" ]

  shop-redis:
    build:
      context: data/redis
    env_file: shop.env
    healthcheck:
      <<: *healthcheck
      test: [ "CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG" ]

  minio:
    build:
      context: data/minio
    env_file: shop.env
    tmpfs:
      - /data:uid=65532,gid=65532
    healthcheck:
      <<: *healthcheck
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/live HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ $$status == *' 200 '* ]]" ]

  shop-api:
    build:
      context: api
    env_file: shop.env
    environment:
      CENTRAL_API_PAYMENT_URL: http://central-stub:5000/pay
      CENTRAL_API_CARD_PAYMENTS_URL: http://central-stub:5000/api/CardPayments
    healthcheck:
      <<: *healthcheck
      test: [ "CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:5000/health', timeout=2)" ]
    depends_on:
      pg:
        condition: service_healthy
      shop-redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  ui:
    build:
      context: app
    healthcheck:
      <<: *healthcheck
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5000/health" ]
    depends_on:
      shop-api:
        condition: service_healthy
