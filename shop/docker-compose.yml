x-app-healthcheck: &app-healthcheck
  test: [ "CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:5000/health', timeout=2)" ]
  interval: 10s
  timeout: 5s
  start_period: 30s
  retries: 5

x-ui-healthcheck: &ui-healthcheck
  test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5000/health" ]
  interval: 10s
  timeout: 5s
  start_period: 10s
  retries: 5

x-minio-healthcheck: &minio-healthcheck
  test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/live HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ $$status == *' 200 '* ]]" ]
  interval: 5s
  timeout: 3s
  retries: 10

services:
  pg:
    build:
      context: data/pg
    env_file: shop.env
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - shop_lan

  shop-redis:
    build:
      context: data/redis
    env_file: shop.env
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - shop_lan

  minio:
    build:
      context: data/minio
    env_file: shop.env
    volumes:
      - minio-data:/data
    healthcheck: *minio-healthcheck
    networks:
      - shop_lan

  shop-api:
    build:
      context: api
    env_file: shop.env
    healthcheck: *app-healthcheck
    depends_on:
      pg:
        condition: service_healthy
      shop-redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - shop_lan
      - bank_lan

  ui:
    build:
      context: app
    ports:
      - "8082:5000"
    healthcheck: *ui-healthcheck
    depends_on:
      shop-api:
        condition: service_healthy
    networks:
      - shop_lan

volumes:
  pg-data:
  redis-data:
  minio-data:

networks:
  shop_lan:
    name: shop_lan
  bank_lan:
    external: true
