name: bank-system

services:
  db:
    build:
      context: data
    platform: linux/amd64
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-BankSystem_Dev123!}
    volumes:
      - mssql-data:/var/opt/mssql

  api:
    build:
      context: .
      dockerfile: web/CentralApi/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: Server=db,1433;Database=BankSystemCentralApi;User Id=sa;Password=${MSSQL_SA_PASSWORD:-BankSystem_Dev123!};MultipleActiveResultSets=true
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/BankSystem.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: Server=db,1433;Database=BankSystem;User Id=sa;Password=${MSSQL_SA_PASSWORD:-BankSystem_Dev123!};MultipleActiveResultSets=true
      BankConfiguration__CentralApiAddress: http://api/
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

  demo:
    build:
      context: .
      dockerfile: demo/DemoShop.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: Server=db,1433;Database=DemoShop;User Id=sa;Password=${MSSQL_SA_PASSWORD:-BankSystem_Dev123!};MultipleActiveResultSets=true
      DirectPaymentsConfiguration__SiteUrl: http://localhost:8082/
      DirectPaymentsConfiguration__CentralApiPaymentUrl: http://localhost:8081/pay
      CardPaymentsConfiguration__CentralApiCardPaymentsUrl: http://api/api/CardPayments
    ports:
      - "8082:80"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  mssql-data:
