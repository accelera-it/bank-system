services:
  db:
    build:
      context: data
    platform: linux/amd64
    env_file: locale.env
    volumes:
      - mssql-data:/var/opt/mssql
    networks:
      - bank_lan

  api:
    build:
      context: .
      dockerfile: web/CentralApi/Dockerfile
    env_file: locale.env
    ports:
      - "${API_PORT:?}:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bank_lan

  web:
    build:
      context: .
      dockerfile: web/BankSystem.Web/Dockerfile
    env_file: locale.env
    ports:
      - "${WEB_PORT:?}:80"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - bank_lan

  demo:
    build:
      context: .
      dockerfile: demo/DemoShop.Web/Dockerfile
    env_file: locale.env
    ports:
      - "${DEMO_PORT:?}:80"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - bank_lan

volumes:
  mssql-data:

networks:
  bank_lan:
    name: bank_lan
