# Only public calls pass through here: calls inside the Docker network are not limited
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

# CentralApi's pay pages are public under /api, so their links have to keep the prefix
map $uri $api_prefix {
    ~^/api/pay(/continue)?$ /api;
    default "";
}

server {
    listen 80;

    # The payment cookie and the login cookies travel together
    large_client_header_buffers 8 32k;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://bank_gateway:5000;
        proxy_set_header X-Forwarded-Prefix $api_prefix;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://bank_web:5000;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
