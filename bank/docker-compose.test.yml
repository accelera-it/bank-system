x-tests: &tests
  image: bank-tests
  build:
    context: .
    dockerfile: app/tests/Dockerfile

services:
  web-unit:
    <<: *tests
    command: app/tests/BankSystem.UnitTests

  web-integration:
    <<: *tests
    command: app/tests/BankSystem.IntegrationTests

  api-unit:
    <<: *tests
    command: app/tests/CentralApi.UnitTests

  api-integration:
    <<: *tests
    command: app/tests/CentralApi.IntegrationTests
