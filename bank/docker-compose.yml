x-app-healthcheck: &app-healthcheck
  test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5000 && printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3" ]
  interval: 10s
  timeout: 5s
  start_period: 30s
  retries: 5

services:
  bank_oracle:
    build:
      context: data/oracle
    env_file: bank.env
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      # The users are created after the database opens, and CentralApi is the last one
      test: [ "CMD-SHELL", "echo 'SELECT 1 FROM DUAL;' | sqlplus -s -L \"CentralApi/$$ORACLE_PASSWORD@//localhost/FREEPDB1\" | grep -q 1" ]
      interval: 10s
      timeout: 10s
      start_period: 60s
      retries: 18
    networks:
      - bank_lan

  bank_redis:
    build:
      context: data/redis
    env_file: bank.env
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - bank_lan

  bank_rabbit:
    build:
      context: data/rabbitmq
    # RabbitMQ keeps its data under the host name, which would change with each new container
    hostname: bank-rabbit
    volumes:
      - rabbit_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity" ]
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 10
    networks:
      - bank_lan

  bank_api:
    build:
      context: .
      dockerfile: app/src/CentralApi/Dockerfile
    env_file: bank.env
    healthcheck: *app-healthcheck
    depends_on:
      bank_oracle:
        condition: service_healthy
    networks:
      - bank_lan

  bank_web:
    build:
      context: .
      dockerfile: app/src/BankSystem.Web/Dockerfile
    env_file:
      - bank.env
      - ../kyc/client.env
    healthcheck: *app-healthcheck
    depends_on:
      bank_oracle:
        condition: service_healthy
      bank_redis:
        condition: service_healthy
      bank_rabbit:
        condition: service_healthy
      bank_gateway:
        condition: service_healthy
    networks:
      - bank_lan
      - kyc_lan

  bank_gateway:
    build:
      context: gateway
    healthcheck:
      test: [ "CMD", "kong", "health" ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    depends_on:
      bank_api:
        condition: service_healthy
    networks:
      - bank_lan

  bank_proxy:
    build:
      context: proxy
    restart: on-failure
    ports:
      - "8081:80"
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health" ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    depends_on:
      bank_web:
        condition: service_healthy
      bank_gateway:
        condition: service_healthy
    networks:
      - bank_lan

volumes:
  oracle_data:
  redis_data:
  rabbit_data:

networks:
  bank_lan:
    name: bank_lan
  kyc_lan:
    external: true
