services:
  kyc-pg:
    build:
      context: data/pg
    env_file: kyc.env
    volumes:
      - kyc-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - kyc_lan

  kyc:
    build:
      context: app
    env_file: kyc.env
    healthcheck: &kyc-healthcheck
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ $$status == *' 200 '* ]]" ]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    depends_on:
      kyc-pg:
        condition: service_healthy
    networks:
      - kyc_lan

  kyc-proxy:
    build:
      context: proxy
    ports:
      - "8080:5000"
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5000/health" ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    depends_on:
      kyc:
        condition: service_healthy
    networks:
      - kyc_lan

volumes:
  kyc-pg-data:

networks:
  kyc_lan:
    name: kyc_lan
