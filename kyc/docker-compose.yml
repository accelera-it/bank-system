services:
  kyc_app:
    build:
      context: app
    env_file:
      - kyc.env
      - client.env
    volumes:
      - kyc_data:/opt/keycloak/data/h2
    healthcheck:
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ $$status == *' 200 '* ]]" ]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    networks:
      - kyc_lan

  kyc_proxy:
    build:
      context: proxy
    ports:
      - "8080:5000"
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5000/health" ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    depends_on:
      kyc_app:
        condition: service_healthy
    networks:
      kyc_lan:
        aliases:
          - kyc-proxy

volumes:
  kyc_data:

networks:
  kyc_lan:
    name: kyc_lan
